services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meetingdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meetingdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: production
      DB_BACKEND: postgres
      DATABASE_URL: postgresql://postgres:postgres@db:5432/meetingdb
      # mock = sin dependencias externas. Cambia a gemini + GEMINI_API_KEY para IA real.
      LLM_PROVIDER: mock
      LLM_FALLBACK_ENABLED: "true"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # URL a la que el navegador llama al backend. Cambiala para desplegar en la nube.
        VITE_API_URL: http://127.0.0.1:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
