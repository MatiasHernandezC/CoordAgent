x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-meetingdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-meetingdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped
    # Sin "ports": la base solo es accesible dentro de la red de Docker.

  backend:
    build: ./backend
    environment:
      APP_ENV: production
      DB_BACKEND: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-meetingdb}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_KEYS_MASTER_KEY: ${LLM_KEYS_MASTER_KEY:-}
      ADMIN_PROXY_HEADER_REQUIRED: ${ADMIN_PROXY_HEADER_REQUIRED:-true}
      PANEL_AUTH_REQUIRED: "true"
      PANEL_ADMIN_USERNAME: ${PANEL_ADMIN_USERNAME:-admin}
      PANEL_ADMIN_DISPLAY_NAME: ${PANEL_ADMIN_DISPLAY_NAME:-Administrador}
      PANEL_ADMIN_PASSWORD: ${PANEL_ADMIN_PASSWORD:?define PANEL_ADMIN_PASSWORD en .env.prod}
      PANEL_SELF_REGISTRATION_ENABLED: ${PANEL_SELF_REGISTRATION_ENABLED:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      RATE_LIMIT_GLOBAL_PER_MINUTE: ${RATE_LIMIT_GLOBAL_PER_MINUTE:-600}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-20}
      RATE_LIMIT_REGISTER_PER_HOUR: ${RATE_LIMIT_REGISTER_PER_HOUR:-5}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1000000}
      GATEWAY_API_TOKEN: ${GATEWAY_API_TOKEN:?define GATEWAY_API_TOKEN en .env.prod}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      GEMINI_MODEL_FALLBACK: ${GEMINI_MODEL_FALLBACK:-gemini-flash-lite-latest}
      GEMINI_COOLDOWN_SECONDS: ${GEMINI_COOLDOWN_SECONDS:-60}
      GEMINI_INPUT_PRICE_PER_MILLION: ${GEMINI_INPUT_PRICE_PER_MILLION:-0.10}
      GEMINI_OUTPUT_PRICE_PER_MILLION: ${GEMINI_OUTPUT_PRICE_PER_MILLION:-0.40}
      LLM_FALLBACK_ENABLED: ${LLM_FALLBACK_ENABLED:-true}
      LLM_CACHE_ENABLED: ${LLM_CACHE_ENABLED:-true}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Santiago}
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost}
      GATEWAY_STATUS_URL: http://gateway:8080/status
      GATEWAY_STATUS_TIMEOUT_SECONDS: ${GATEWAY_STATUS_TIMEOUT_SECONDS:-2}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_TRIGGER_WORD: ${SLACK_TRIGGER_WORD:-@coordina}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    restart: on-failure:5
    init: true
    security_opt:
      - no-new-privileges:true
    # Sin "ports": Caddy lo publica bajo /api.

  frontend:
    build:
      context: ./frontend
      args:
        # Mismo dominio que sirve Caddy: las llamadas /api quedan en el mismo origen.
        VITE_API_URL: ${PUBLIC_URL:-http://localhost}
        VITE_BOT_PHONE_NUMBER: ${BOT_PHONE_NUMBER:-+56 9 3527 1985}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging
    restart: on-failure:5
    security_opt:
      - no-new-privileges:true
    # Sin "ports": Caddy lo publica en la raiz.

  gateway:
    build: ./gateway
    ports:
      # QR y estado disponibles solo desde este equipo; nunca por el tunel.
      - "127.0.0.1:8082:8080"
    environment:
      BACKEND_URL: http://backend:8000
      GATEWAY_API_TOKEN: ${GATEWAY_API_TOKEN:?define GATEWAY_API_TOKEN en .env.prod}
      TRIGGER_WORD: ${TRIGGER_WORD:-@coordina}
      WA_AUTH_DIR: /data/wa-auth
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Tuning opcional del supervisor (documentado en docs/DESPLIEGUE_WHATSAPP.md).
      # Debe superar GEMINI_TIMEOUT_SECONDS (45s) mas el procesamiento local.
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-75000}
      WA_CONNECT_TIMEOUT_MS: ${WA_CONNECT_TIMEOUT_MS:-60000}
      WA_KEEP_ALIVE_MS: ${WA_KEEP_ALIVE_MS:-30000}
      WA_RECONNECT_MIN_MS: ${WA_RECONNECT_MIN_MS:-2000}
      WA_RECONNECT_MAX_MS: ${WA_RECONNECT_MAX_MS:-60000}
      WA_GROUP_SYNC_INTERVAL_MS: ${WA_GROUP_SYNC_INTERVAL_MS:-300000}
      WA_FIRE_INIT_QUERIES: ${WA_FIRE_INIT_QUERIES:-false}
      GATEWAY_HEARTBEAT_INTERVAL_MS: ${GATEWAY_HEARTBEAT_INTERVAL_MS:-600000}
      RECENT_MESSAGE_LIMIT: ${RECENT_MESSAGE_LIMIT:-500}
      MAX_PENDING_MESSAGES: ${MAX_PENDING_MESSAGES:-500}
      PENDING_RETRY_MIN_MS: ${PENDING_RETRY_MIN_MS:-2000}
      PENDING_RETRY_MAX_MS: ${PENDING_RETRY_MAX_MS:-300000}
      MAX_PENDING_ATTEMPTS: ${MAX_PENDING_ATTEMPTS:-12}
      HEALTH_PORT: 8080
    volumes:
      - waauth:/data/wa-auth
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging: *default-logging
    restart: on-failure:5
    init: true
    security_opt:
      - no-new-privileges:true
    # tty para poder leer el QR con: docker compose -f docker-compose.prod.yml logs -f gateway
    stdin_open: true
    tty: true

  caddy:
    image: caddy:2
    ports:
      # Solo localhost: Cloudflare Tunnel es la unica entrada publica.
      - "127.0.0.1:8080:80"
    environment:
      CADDY_SITE_ADDRESS: ":80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging
    restart: on-failure:5
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  waauth:
  caddy_data:
  caddy_config:
