services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meetingdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meetingdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: production
      DB_BACKEND: postgres
      DATABASE_URL: postgresql://postgres:postgres@db:5432/meetingdb
      # mock = sin dependencias externas. Corre con --env-file backend/.env para
      # traer LLM_PROVIDER=gemini y el resto de las llaves desde ahi.
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_FALLBACK_ENABLED: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_KEYS_MASTER_KEY: ${LLM_KEYS_MASTER_KEY:-}
      # Sin Caddy en dev no hay header X-Coordina-Admin: sin esto el panel
      # (llaves Gemini, Google Calendar) devuelve 401.
      ADMIN_PROXY_HEADER_REQUIRED: ${ADMIN_PROXY_HEADER_REQUIRED:-false}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_TRIGGER_WORD: ${SLACK_TRIGGER_WORD:-@coordina}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # URL a la que el navegador llama al backend. Cambiala para desplegar en la nube.
        VITE_API_URL: http://127.0.0.1:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
