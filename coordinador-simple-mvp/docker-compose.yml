services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meetingdb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meetingdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: development
      DB_BACKEND: postgres
      DATABASE_URL: postgresql://postgres:postgres@db:5432/meetingdb
      # mock = sin dependencias externas. Corre con --env-file backend/.env para
      # traer LLM_PROVIDER=gemini y el resto de las llaves desde ahi.
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_FALLBACK_ENABLED: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_KEYS_MASTER_KEY: ${LLM_KEYS_MASTER_KEY:-}
      # Sin Caddy en dev no hay header X-Coordina-Admin: sin esto el panel
      # (llaves Gemini, Google Calendar) devuelve 401.
      ADMIN_PROXY_HEADER_REQUIRED: ${ADMIN_PROXY_HEADER_REQUIRED:-false}
      PANEL_AUTH_REQUIRED: ${PANEL_AUTH_REQUIRED:-true}
      PANEL_ADMIN_USERNAME: ${PANEL_ADMIN_USERNAME:-admin}
      PANEL_ADMIN_PASSWORD: ${PANEL_ADMIN_PASSWORD:-admin-local}
      PANEL_SEED_DEMO_USERS: ${PANEL_SEED_DEMO_USERS:-true}
      PANEL_SELF_REGISTRATION_ENABLED: ${PANEL_SELF_REGISTRATION_ENABLED:-true}
      GATEWAY_API_TOKEN: ${GATEWAY_API_TOKEN:-local-gateway-only}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_TRIGGER_WORD: ${SLACK_TRIGGER_WORD:-@coordina}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # URL a la que el navegador llama al backend. Cambiala para desplegar en la nube.
        VITE_API_URL: http://127.0.0.1:8001
    ports:
      # 5173 queda disponible para el servidor Vite local existente.
      - "127.0.0.1:5174:80"
    depends_on:
      - backend

  gateway:
    build: ./gateway
    environment:
      BACKEND_URL: http://backend:8000
      GATEWAY_API_TOKEN: ${GATEWAY_API_TOKEN:-local-gateway-only}
      TRIGGER_WORD: ${TRIGGER_WORD:-@coordina}
      WA_AUTH_DIR: /data/wa-auth
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-75000}
      WA_CONNECT_TIMEOUT_MS: ${WA_CONNECT_TIMEOUT_MS:-60000}
      WA_KEEP_ALIVE_MS: ${WA_KEEP_ALIVE_MS:-30000}
      WA_RECONNECT_MIN_MS: ${WA_RECONNECT_MIN_MS:-2000}
      WA_RECONNECT_MAX_MS: ${WA_RECONNECT_MAX_MS:-60000}
      WA_GROUP_SYNC_INTERVAL_MS: ${WA_GROUP_SYNC_INTERVAL_MS:-300000}
      WA_FIRE_INIT_QUERIES: ${WA_FIRE_INIT_QUERIES:-false}
      GATEWAY_HEARTBEAT_INTERVAL_MS: ${GATEWAY_HEARTBEAT_INTERVAL_MS:-600000}
      RECENT_MESSAGE_LIMIT: ${RECENT_MESSAGE_LIMIT:-500}
      MAX_PENDING_MESSAGES: ${MAX_PENDING_MESSAGES:-500}
      PENDING_RETRY_MIN_MS: ${PENDING_RETRY_MIN_MS:-2000}
      PENDING_RETRY_MAX_MS: ${PENDING_RETRY_MAX_MS:-300000}
      MAX_PENDING_ATTEMPTS: ${MAX_PENDING_ATTEMPTS:-12}
      HEALTH_PORT: 8080
    volumes:
      - waauth:/data/wa-auth
    depends_on:
      backend:
        condition: service_started
    expose:
      - "8080"
    ports:
      # Solo accesible desde este computador; sirve el QR limpio en /qr.
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stdin_open: true
    tty: true

volumes:
  pgdata:
  waauth:
