name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coordinador-simple-mvp/backend
    env:
      DB_BACKEND: json
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: coordinador-simple-mvp/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  gateway:
    name: Gateway (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coordinador-simple-mvp/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: coordinador-simple-mvp/gateway/package-lock.json
      - run: npm ci
      - run: node --test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coordinador-simple-mvp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: coordinador-simple-mvp/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
